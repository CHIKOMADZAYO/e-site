# Render Blueprint for the eStore Django app
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: estore
    runtime: python
    # Persistent disks require a paid plan (Free tier cannot attach a disk).
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "bash render_start.sh"
    healthCheckPath: "/"
    # Persistent disk for uploaded media (product images).
    disk:
      name: estore-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # DATABASE_URL is injected automatically from the Render Postgres below.
      - key: DATABASE_URL
        fromDatabase:
          name: estore-db
          property: connectionString
      # Must equal the disk mountPath so uploads persist.
      - key: MEDIA_ROOT
        value: /opt/render/project/src/media
      # Safaricom Daraja (M-Pesa) sandbox credentials - set in the dashboard.
      - key: MPESA_ENVIRONMENT
        value: "sandbox"
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false

databases:
  - name: estore-db
    plan: free
    databaseName: estore
    user: estore
    region: oregon